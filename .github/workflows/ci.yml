name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      # postbuild: service worker, URL/SEO parity with the SPA (scripts/check-parity.mjs) and the JS budget.
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # Serves dist/ with the production Caddyfile in the Caddy image (see playwright.config.js).
      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  perf:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Mobile LCP under 1.5 s on / (median of 3) and no script files on the content pages.
      - name: Performance budget (Lighthouse)
        run: CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable)" BUDGET_OUT=lighthouse-budget.json node scripts/lighthouse-budget.mjs

      - name: Upload budget result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-budget
          path: lighthouse-budget.json
          if-no-files-found: ignore
          retention-days: 14
