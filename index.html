<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <!-- Privacy: runs before every other script (notably the analytics script). Moves the share-link
         parameters (g, a, b, m, lf) out of the address into window.__shareQuery (memory only) so they are never
         sent to the statistics server. Other parameters (utm_source, ref, ...) stay. Mirrored by SHARE_KEYS in
         src/utils/shareState.js; index.shareQuery.test.js runs this exact script. -->
    <script>
      (function () {
        try {
          var s = location.search;
          if (!s || s.length < 2) return;
          var keys = { g: 1, a: 1, b: 1, m: 1, lf: 1 };
          var own = [];
          var rest = [];
          s.slice(1).split('&').forEach(function (part) {
            var k = part.split('=')[0];
            try { k = decodeURIComponent(k.replace(/\+/g, ' ')); } catch (e) {}
            (Object.prototype.hasOwnProperty.call(keys, k) ? own : rest).push(part);
          });
          if (!own.length) return;
          window.__shareQuery = own.join('&');
          history.replaceState(history.state, '', location.pathname + (rest.length ? '?' + rest.join('&') : '') + location.hash);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Apply theme before first paint to avoid a flash of the wrong theme (FOUC) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <!-- /embed (iframe widget): theme and background from the query string, before first paint. -->
    <script>
      (function () {
        if (location.pathname.replace(/\/$/, '') !== '/embed') return;
        var h = document.documentElement, q = new URLSearchParams(location.search);
        h.classList.toggle('dark', q.get('theme') === 'dark');
        if (q.get('bg') === 'transparent') h.setAttribute('data-embed-bg', 'transparent');
      })();
    </script>
    <title>Dansk Levetidsberegner - Beregn din forventede levetid</title>
    <meta name="description" content="Beregn din forventede levetid baseret på danske statistikker. Gratis online levetidsberegner med præcise data fra Danmarks Statistik." />
    <meta name="keywords" content="levetid, beregner, danmark, statistik, dødsalder, forventet levetid" />
    <meta property="og:title" content="Dansk Levetidsberegner" />
    <meta property="og:description" content="Beregn din forventede levetid baseret på danske statistikker" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />

    <!-- Plausible Analytics -->
    <script defer data-domain="levetidsberegner.dk" src="https://analytics.holstjensen.eu/js/script.file-downloads.outbound-links.pageview-props.tagged-events.js"></script>
    <script>window.plausible = window.plausible || function() { (window.plausible.q = window.plausible.q || []).push(arguments) }</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
